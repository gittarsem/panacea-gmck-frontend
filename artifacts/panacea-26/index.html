    <!-- Prevent theme flash -->
    <script>
      (() => {
        const saved =
          localStorage.getItem(
            "panacea_theme"
          );

        const theme =
          saved === "dark" ||
          saved === "light"
            ? saved
            : window.matchMedia(
                "(prefers-color-scheme: dark)"
              ).matches
              ? "dark"
              : "light";

        document.documentElement.classList.toggle(
          "dark",
          theme === "dark"
        );

        document.documentElement.dataset.theme =
          theme;
      })();
    </script>
